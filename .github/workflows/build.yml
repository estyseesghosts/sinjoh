name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: apt-get update && apt-get install -y git python3 make zip

      - name: Bootstrap the game and SDK sources
        run: python3 tools/game/bootstrap.py

      - name: Build lock and provenance tests
        run: python3 tests/native/test_build_guard.py

      - name: Build the release profile
        run: sh tools/build.sh 0 -j"$(nproc)"

      - name: Build the measurement profile
        run: sh tools/build.sh 1 -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: sinjoh-3dsx
          path: |
            build/game/3ds/sinjoh-platinum.3dsx
            build/game/3ds-prof/sinjoh-platinum-dbg.3dsx
            build/game/3ds/sinjoh-platinum.build-info.json
            build/game/3ds-prof/sinjoh-platinum-dbg.build-info.json
          if-no-files-found: error
