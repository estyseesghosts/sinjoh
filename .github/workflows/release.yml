name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (a tag like v0.0.1 is created if it does not exist)"
        required: true
        default: "v0.0.1"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: apt-get update && apt-get install -y git python3 make zip unzip curl xz-utils ca-certificates

      - name: Install makerom and bannertool
        run: |
          # The published Linux binaries of both tools need GLIBC 2.38; this
          # image is Debian 12 (2.36). Both build from source with no exotic
          # dependencies (bannertool vendors stb headers; makerom needs zlib).
          apt-get install -y cmake build-essential zlib1g-dev
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR /tmp/Project_CTR
          make -C /tmp/Project_CTR/makerom -j"$(nproc)"
          install -m755 /tmp/Project_CTR/makerom/bin/makerom /usr/local/bin/makerom

          curl -fsSL -o /tmp/bt.tar.gz \
            https://github.com/carstene1ns/3ds-bannertool/archive/refs/tags/1.2.3.tar.gz
          tar -xzf /tmp/bt.tar.gz -C /tmp
          cmake -S /tmp/3ds-bannertool-1.2.3 -B /tmp/3ds-bannertool-1.2.3/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/3ds-bannertool-1.2.3/build -j"$(nproc)"
          install -m755 "$(find /tmp/3ds-bannertool-1.2.3/build -type f -name bannertool)" /usr/local/bin/bannertool

          makerom -v | head -2
          bannertool 2>&1 | head -2 || true

      - name: Bootstrap the game and SDK sources
        run: python3 tools/game/bootstrap.py

      - name: Build the release profile
        run: make -f engine/game.mk TARGET=3ds program PROFILE=0 -j"$(nproc)"

      - name: Build the measurement profile
        run: make -f engine/game.mk TARGET=3ds program PROFILE=1 -j"$(nproc)"

      - name: Build the HOME Menu forwarder (CIA)
        run: |
          export DEVKITPRO="${DEVKITPRO:-/opt/devkitpro}"
          export DEVKITARM="${DEVKITARM:-$DEVKITPRO/devkitARM}"
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          chmod +x tools/forwarder/build.sh
          tools/forwarder/build.sh

      - name: Package the ROM-data setup tools
        run: |
          mkdir -p dist
          (cd builder && zip -9 -r ../dist/sinjoh-asset-tools.zip \
              README.md prepare.py prepare.bat extract_rom.py pack.py verify_rom.py)
          unzip -l dist/sinjoh-asset-tools.zip

      - name: Collect the release files
        run: |
          mkdir -p dist
          cp build/game/3ds/sinjoh-platinum.3dsx dist/
          cp build/game/3ds-prof/sinjoh-platinum-dbg.3dsx dist/
          cp build/forwarder/sinjoh-platinum.cia dist/
          ls -l dist

      - name: Upload the build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sinjoh-release
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: Sinjoh Platinum ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/sinjoh-platinum.3dsx
            dist/sinjoh-platinum-dbg.3dsx
            dist/sinjoh-platinum.cia
            dist/sinjoh-asset-tools.zip
          body: |
            native 3DS port of Pokemon Platinum for the original 3DS / 2DS (O3DS profile, stock clock).

            **this release contains no game data.** you need your own Platinum `.nds`.

            ## what you need
            - a 3DS with custom firmware (Luma3DS) and the Homebrew Launcher
            - your own unmodified USA dump of Pokemon Platinum as a `.nds`. nothing here contains game data and the `.pak` files you make are for your own use only, don't share them
            - Python 3.10+ on your PC (only for the one-time data step)

            ## setup
            1. download `sinjoh-platinum.3dsx` and `sinjoh-asset-tools.zip`
            2. copy the `.3dsx` into `/3ds/` on your SD card and **keep the filename**, e.g. `/3ds/sinjoh-platinum.3dsx`
            3. unzip `sinjoh-asset-tools.zip` on your PC
               - **windows:** drag your `.nds` onto `prepare.bat`
               - **mac/linux:** `python prepare.py your-game.nds`

               it checks your dump, then writes the data in a few seconds. the rom is only read, nothing is uploaded. add `--sd E:\` (your SD card's drive) and it writes straight to `3ds/` on the card and you can skip step 4
            4. copy what's inside the produced `3ds/` folder (`sinjoh/data/platinum.pak` + `platinum.manifest.json`) to the root of the card; make the folders if they don't exist
            5. launch sinjoh from the Homebrew Launcher

            saves live on the SD card. if prepare says your dump isn't usable it prints which versions are supported (USA only, unmodified).

            ## the CIA
            `sinjoh-platinum.cia` is just a HOME menu shortcut (Luma3DS required). it does not contain the game: you still need the `.3dsx` at `/3ds/sinjoh-platinum.3dsx` and the data from step 4. install it once with FBI.

            ## the dbg build
            `sinjoh-platinum-dbg.3dsx` is the measurement build (perf counters, `[probe]` slots). it is slower and only useful for profiling.

            problems or questions: https://discord.gg/wJNprjYCun
